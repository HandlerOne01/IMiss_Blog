# deploy/nginx.conf —— 生产 Nginx 里**只有 Agent 那一段**
# ============================================================================
# 为什么只有一段：静态站点部分（root / try_files / 长缓存 / 关掉的页面给真 404 /
# error_page）已经在 `ARCH.md` §12.2 的完整 `server{}` 里，这里**不重复**——
# 两处各写一份完整 `server{}` 必然漂移（本项目在 §8.5/§8.6 上就是这么漂的）。
#
# 用法（二选一）：
#   · 放进 `conf.d/`：文件内容是合法的 `server{}` 子上下文语句，可直接 include；
#   · 或在已有的 `server{}` 里加一行：`include /etc/nginx/snippets/pet-gateway.conf;`
#
# 这条 location 的前提：
#   ① 网关进程在 `127.0.0.1:8787` 上跑（`node server/pet-gateway.mjs`，
#      或 systemd unit `deploy/pet-gateway.service`）；
#   ② 站点是**用 `PUBLIC_AGENT_BASE_URL=/api/agent` 构建**的（否则前端还是直连 2024）；
#   ③ 网关侧要 `PET_GATEWAY_TRUST_PROXY=1` 才会认下面那两个 `X-Forwarded-*`
#      （没有反代时开它 = 访客可伪造 XFF 绕开限流，见 §8.5）；
#   ④ `PET_ALLOWED_ORIGINS` 里**必须有线上域名**：浏览器发 POST 时会带
#      `Origin: https://<站点域名>`，不在白名单里会被网关 403（默认值只有 localhost）。
# ============================================================================

location /api/agent/ {
    proxy_pass http://127.0.0.1:8787/api/agent/;   # 尾部斜杠要留：路径原样透传，网关自己剥前缀

    proxy_http_version 1.1;
    proxy_set_header Connection "";                # 清掉 close，SSE 才能一直挂着
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    proxy_buffering off;                           # ★ SSE 必须：攒着不发 = 前端一个字都看不到
    proxy_cache off;                               # 别缓存流式响应
    proxy_read_timeout 300s;                       # ★ 与前端 300 秒硬上限、网关 ROUND_TIMEOUT 对齐
    proxy_send_timeout 300s;
    chunked_transfer_encoding on;                  # 流式响应用 chunked（不设 content-length）

    client_max_body_size 8k;                       # ★ 与网关 PET_GATEWAY_MAX_BODY=8192 对齐（超了 Nginx 先回 413）
}
