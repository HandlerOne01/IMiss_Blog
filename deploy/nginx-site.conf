# ============================================================================
# deploy/nginx-site.conf —— 完整站点的 Nginx 配置（静态段 + Agent 反代段）
# ----------------------------------------------------------------------------
# 这份文件是 **P6 上线预工**的产物：内容与域名/服务器无关的部分全部写死，
# 与域名/路径相关的部分一律留成**显眼的占位符**（`__XXX__`），上线当天逐个替换。
#
# ⛔ 本文件**从未在真机上跑过 `nginx -t`**（开发机没有 Nginx，见 deploy/README.md）。
#    第一次装到服务器上时，**第一件事**就是下面这两条命令：
#
#        sudo cp deploy/nginx-site.conf /etc/nginx/conf.d/imiss-blog.conf   # 或放进 sites-available/ 再 ln -s
#        sudo nginx -t                                                      # ← 必须 0 错误再往下走
#        sudo systemctl reload nginx
#
#    一键自查"还有没有没填的占位符"（输出必须为空）：
#        grep -nE '__[A-Z_]+__' /etc/nginx/conf.d/imiss-blog.conf
#
# ⚠️ 版本前提：`listen 443 ssl http2;` 这一行在 **nginx ≥ 1.25.1** 上会打一条
#    "the `listen ... http2` directive is deprecated" 警告（**不影响功能**）。
#    想消掉警告就换成两行：`listen 443 ssl;` + `http2 on;`。
#    Ubuntu 22.04 / Debian 12 自带的 1.22~1.24 **不支持 `http2 on;`**，所以这里默认用旧写法。
# ============================================================================
#
# ┌──────────────────────────────────────────────────────────────────────────┐
# │ 上线当天要填的 3 个值（改完必须 `nginx -t`）                                │
# ├──────────────┬────────────────────────────┬──────────────────────────────┤
# │ 占位符        │ 例子                        │ 不填会怎样                    │
# ├──────────────┼────────────────────────────┼──────────────────────────────┤
# │ __DOMAIN__   │ imiss.example.com          │ server_name 收不到请求 →     │
# │              │ （只写域名，不带 https://）  │ 落到默认 server（可能串站）   │
# │ __WEB_ROOT__ │ /var/www/imiss-blog/dist   │ root 不存在 → 全站 404       │
# │              │ （= 发布脚本的 --web-root）  │ （且与 publish.mjs 要对齐）   │
# │ __CERT_PATH__│ /etc/letsencrypt/live/…    │ nginx -t 直接报错，起不来     │
# │ __SNIPPET_PATH__ │ /etc/nginx/snippets/pet-gateway.conf │ Agent 全挂（502/404）│
# └──────────────┴────────────────────────────┴──────────────────────────────┘
#   · __CERT_PATH__ 有两行（证书与私钥各一行），certbot 默认长这样：
#       __CERT_PATH__/fullchain.pem      ← ssl_certificate
#       __CERT_PATH__/privkey.pem        ← ssl_certificate_key
#     所以填 `/etc/letsencrypt/live/你的域名` 就行（**不要**带尾斜杠）。
#   · __SNIPPET_PATH__：把本仓库的 `deploy/nginx.conf` 装到那个路径（它就是
#     `location /api/agent/ { … }` 那一段的**唯一正文**）。装法见 deploy/README.md 第 3 步。
#     不想上桌宠 Agent 就把下面那两行 `include` 注释掉，其余配置完全独立。
#
# ── 这个站点是什么形态（决定了下面几条 try_files / 缓存为什么这么写）─────────
#   · 纯静态产物：`pnpm build` → `dist/`（实测 **165 个 html / 799 个文件 / 约 114 MiB**）；
#   · `astro.config.mjs` 里 `trailingSlash: "always"` → 每个路由都是
#     `<route>/index.html`（如 `dist/roadmap/index.html`），**不是 SPA**，
#     所以**不能**用 `try_files $uri $uri/ /index.html` 那种回退（会把 404 变成首页 200）；
#   · 真 404 页是 **单文件** `dist/404.html`（不是 `404/index.html`），`dist/404.html` 确实存在（已核）。
# ============================================================================

# ---------------------------------------------------------------------------
# ① 80 端口：只做跳转，不做别的（永远不要把站点开在 80 上）
# ---------------------------------------------------------------------------
server {
    listen      80;
    listen      [::]:80;
    server_name __DOMAIN__ www.__DOMAIN__;

    # certbot --webroot 签发/续期要靠它，所以这里必须放行 /.well-known/acme-challenge/
    # （放在 `location /` 之前无所谓：nginx 选 `前缀最长` 的那个 location）
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/acme;          # ← 用 certbot --webroot -w /var/www/acme 时保持同一路径
        default_type "text/plain";
        allow all;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ---------------------------------------------------------------------------
# ② 443 端口：真正的站点
# ---------------------------------------------------------------------------
server {
    listen      443 ssl http2;
    listen      [::]:443 ssl http2;
    server_name __DOMAIN__ www.__DOMAIN__;

    # ── 证书（两行都要填）─────────────────────────────────────────────────
    ssl_certificate     __CERT_PATH__/fullchain.pem;
    ssl_certificate_key __CERT_PATH__/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;      # 关掉 TLSv1.0/1.1（2026 年的浏览器都支持 1.2+）
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;

    # ── 静态根 ────────────────────────────────────────────────────────────
    root  __WEB_ROOT__;
    index index.html;

    charset utf-8;

    # ⛔ 不开 autoindex：目录里没有 index.html 时给 404，而不是把文件清单列给访客
    autoindex off;

    # ⛔ 不开 `server_tokens off` 之外的隐藏；只把版本号藏掉（顺手做的事）
    server_tokens off;

    # ── 安全响应头（最小集，只加**有把握不破坏本站功能**的）─────────────────
    # ⚠️ nginx 的 add_header 是「就近覆盖」：某个 location 里只要出现一条 add_header，
    #    server 段的这些就**全部失效**。所以下面每个自定义 location 都重复写了这几行。
    add_header X-Content-Type-Options "nosniff" always;                    # 阻止浏览器猜 MIME（字体/wasm 必需）
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;   # 对外只发 origin，站内保留完整 referer
    add_header X-Frame-Options "SAMEORIGIN" always;                        # 防被别站 iframe 套壳（本站自己不 iframe 自己）
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
    # HTML 一律 `no-cache`（= 每次用之前回源校验，命中 304）：改版后**立刻**生效，
    # 不会被浏览器按 heuristics 拿旧页面。⚠️ 注意它**不是**"不缓存"，只是"必须回源问一次"。
    # 带哈希的 /_astro/ 与其余静态目录在各自的 location 里覆盖成自己的缓存口径。
    add_header Cache-Control "no-cache" always;
    # ⚠️ 故意**不加** Strict-Transport-Security：HSTS 一旦发出去就撤不回来（浏览器会长时间强跳 https，
    #    证书出问题或想临时回 http 就会把自己锁在门外）。**确认 https 稳定跑满一周**后再取消下面这行的注释：
    # add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    #
    # ⚠️ 故意**不加** Content-Security-Policy：本站产物里有 Astro 内联脚本（主题初始化 / 桌宠 / Swup 钩子）、
    #    Pagefind 的 wasm、以及 Swup 的动态 import。写一条错的 CSP = 白屏，而写一条对的 CSP 需要
    #    先把所有内联脚本的 hash 或 nonce 铺进产物（属 **P6 之后的独立任务**）。要上 CSP 时的最小起点：
    #        Content-Security-Policy: default-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; frame-ancestors 'self'
    #    （`'unsafe-inline'` 是为了内联脚本；它会让 CSP 的 XSS 防护打折 —— 所以这不是"顺手加"的东西。）

    # ── 压缩：只压文本类；图片/字体本来就压过了，再压是白烧 CPU ──────────────
    gzip on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    # text/html 是 nginx **默认就压**的（即使不写）；这里显式列出来是为了让这份清单可读
    gzip_types text/plain text/css text/xml application/javascript application/json
               application/xml image/svg+xml application/manifest+json application/wasm;
    gzip_vary on;            # 加 `Vary: Accept-Encoding`（中间有 CDN 时必须）
    # ⚠️ 不启用 brotli：`brotli on;` 需要 `ngx_brotli` 模块（发行版默认没编进去），
    #    写了会直接 `nginx -t` 报 `unknown directive "brotli"`。要用就自己编译或在 CDN 上开。

    # ── 缓存策略 ──────────────────────────────────────────────────────────
    # 口径：**带内容哈希的 → 长缓存 immutable；可能改名字不变的 → 短缓存/不缓存。**
    #   · /_astro/**：文件名带 8 位内容哈希（实测 166 个文件），改内容必改名 → 一年 immutable
    location /_astro/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
        access_log off;                       # 静态资源不记日志（省 IO；要排障时再打开）
        try_files $uri =404;
    }

    #   · /assets/**（字体/图标/CSS，文件名**没有**哈希）→ 30 天。改版后最坏 30 天内新旧混用，
    #     所以这里**不加 immutable**（immutable 会让浏览器 30 天内连刷新都不回源问）。
    location /assets/ {
        add_header Cache-Control "public, max-age=2592000" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
        try_files $uri =404;
    }

    #   · /images/** 与 /og/**：文章配图与 OG 卡片（**没有**文件名哈希，且文件名跟文章 slug 走）。
    #     7 天——够省流量，又不至于让"换了一张同名封面"卡一个月。
    location /images/ {
        add_header Cache-Control "public, max-age=604800" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
        try_files $uri =404;
    }
    location /og/ {
        add_header Cache-Control "public, max-age=604800" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
        try_files $uri =404;
    }

    #   · /pagefind/**：搜索索引（184 个文件，含 .pf_meta / .pf_index 等**自定义后缀**的二进制分片）。
    #     ⚠️ 这里**故意用 `no-cache` 而不是长缓存**：索引文件名基本不带哈希，而每次 `pnpm build`
    #     都会重写它们 → 长缓存会让访客"搜的是上一版的文章"。`no-cache` 不是"不缓存"，
    #     而是"每次用之前回源问一下"（命中 304，代价很小）。
    #     顺带：`image/svg+xml` 之类的类型由 mime.types 兜底；`.pf_*` 走到 `default_type`。
    location /pagefind/ {
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
        try_files $uri =404;
    }

    #   · /api/**（构建期导出的 allPostMeta.json / dynamic.json）：短缓存 + 必须回源校验
    location /api/ {
        add_header Cache-Control "public, max-age=300, must-revalidate" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
        try_files $uri =404;
    }

    #   · sitemap / robots / llms.txt：给爬虫看的，别缓存太久，否则改版后爬虫还拿旧地图
    location ~ ^/(sitemap.*\.xml|robots\.txt|llms\.txt)$ {
        add_header Cache-Control "public, max-age=3600" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
        try_files $uri =404;
    }

    # ── 真 404 页 + 已关闭页面的处置 ───────────────────────────────────────
    # 自定义 404：`dist/404.html` 已确认存在（单文件，实测 239 421 字节 ≈ 234 KiB 的完整页面）。
    # ⚠️ 404 不缓存，否则访客会一直看到"上次那个 404"。
    error_page 404 /404.html;
    location = /404.html {
        internal;                                  # 只允许 nginx 内部转过来，访客直接请求 /404.html 得到 404
        add_header Cache-Control "no-store" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    # 已关闭的 4 个页面。⚠️ Astro 对它们**仍然产出** `dist/bilibili/index.html` 这类
    # 200 + meta refresh + noindex 的"跳转存根"（陷阱 T17）——直接访问会先看到一个 200 空页。
    # 这里在 Web 服务器层直接掐掉，让线上返回**真 404**（落到上面的 404 页）。
    #   · /friends/、/sponsor/ 的产物文件已随 v1.47 删除，本来就 404（这里写着当保险）
    #   · /bilibili/、/bangumi/ 的存根文件**还在产物里**，必须靠这几行
    location = /friends/  { return 404; }
    location = /bilibili/ { return 404; }
    location = /bangumi/  { return 404; }
    location = /sponsor/  { return 404; }
    # 存根里的 meta refresh 目标是 /404/（带斜杠）；真正的产物是 /404.html（无斜杠）
    location = /404/      { return 404; }
    # ⚠️ `/rank/`、`/rank/jp/`、`/rank/cn/`、`/rank/game/` **不加任何 location**：
    #    产物里已经没有它们了（v1.41 整体删除，R-PATH-06），下面通用的 `try_files … =404`
    #    就会给真 404。⚠️ **绝不要**在这里加 301 —— `verify:ui` 的 R-PATH-06 按 404 断言。

    # ── 隐藏文件 / 目录（.env、.git、备份文件等）一律不可访问 ───────────────
    # 这一条是"别把密钥传进 web root"之外的第二道闸（见 deploy/README.md 的严禁事项）
    location ~ /\.(?!well-known/) {
        return 404;
    }

    # ── ★ Agent 反代（唯一正文在 deploy/nginx.conf，两处不漂移）──────────────
    # 下面这行 `include` 把 `location /api/agent/ { … }` 整个段落的**唯一正文**引进来。
    # 改 Agent 那段只需要改 deploy/nginx.conf 一处。
    # ⚠️ 这里**故意不写任何 `add_header` / 缓存头**：网关自己对每个响应都下了
    #    `Cache-Control: no-store`（普通响应）或 `no-cache, no-transform`（SSE 流），
    #    再叠一层会变成**两个 Cache-Control 头**（语义以哪个为准由客户端自行决定 = 不可预期）。
    #    server 段那条 `add_header Cache-Control "no-cache"` 在这里被上游自己的头盖住，是想要的结果。
    location /api/agent/ {
        include __SNIPPET_PATH__;
    }

    # ── 主静态路由 ────────────────────────────────────────────────────────
    # `trailingSlash: always` → 产物是 `<route>/index.html`。
    # ⚠️ 这里**必须是 `$uri/index.html` 在前、`$uri/` 在后**：
    #    如果写成 `try_files $uri $uri/ $uri/index.html =404;`，那么**任何存在的目录**
    #    都会命中 `$uri/` 分支（nginx 对目录的 `$uri/` 判定是"存在即命中"），
    #    于是在没有 index.html 的目录上会退化成 **403 目录禁止**而不是 404。
    # ⚠️ 也**绝不能**写成 `try_files $uri $uri/ /index.html;` ——那是 SPA 的回退写法，
    #    会把**所有 404 都变成首页 200**（爬虫会收录一堆"首页副本"）。
    location / {
        try_files $uri $uri/index.html =404;
    }
}

# ============================================================================
# 改完这份文件后的标准动作（每次都要）：
#   sudo nginx -t                    # 语法 + 证书路径 + include 路径一起校验，必须 0 错误
#   sudo systemctl reload nginx      # 平滑重载（不 drop 连接；SSE 长连接会被优雅收尾）
# 冒烟（把 imiss.example.com 换成真域名）：
#   curl -sSI https://imiss.example.com/ | head -1                  # 期望 HTTP/2 200
#   curl -sSI http://imiss.example.com/ | head -1                   # 期望 301（Location: https://…）
#   curl -sS -o /dev/null -w '%{http_code}\n' https://imiss.example.com/roadmap/   # 200
#   curl -sS -o /dev/null -w '%{http_code}\n' https://imiss.example.com/rank/      # 404
#   curl -sS -o /dev/null -w '%{http_code}\n' https://imiss.example.com/bilibili/  # 404（存根被掐掉）
#   curl -sS -o /dev/null -w '%{http_code}\n' https://imiss.example.com/api/agent/ok  # 200（网关 + 上游都活着）
#   curl -sSI -H 'Accept-Encoding: gzip' https://imiss.example.com/_astro/xxx.css | grep -i content-encoding
# 完整的上线操作单（含回滚与故障处置）见 deploy/README.md。
# ============================================================================
