<?xml version="1.0" encoding="UTF-8"?>
<!--
  IMiss Blog 站点标识（矢量源文件，唯一设计源）
  ============================================================
  设计说明（怎么改都不怕）：
    · 三要素取自"爱弥斯"的视觉特征：粉色晶体心（主体）＋ 青色四角星芒（头饰）＋ 两侧机械翼片
    · 底是深蓝紫方圆（squircle），所以亮/暗两种导航栏上都清晰，也天然适合当 favicon
    · 全部分量都是纯几何路径，没有描边依赖、没有外部图片，缩放不糊
  改完请跑一次 `pnpm make:logo` 重新生成 webp 与 favicon（浏览器不认 svg 做 favicon/OG 的场合很多）
  颜色令牌：粉 #FF8FB8→#EF5E96｜青 #8CE7F5→#4FC3E8｜底 #1B2340→#2A2150
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128" role="img" aria-label="IMiss Blog">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#20294C"/>
      <stop offset="55%" stop-color="#1B2340"/>
      <stop offset="100%" stop-color="#2A2150"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="42%" r="58%">
      <stop offset="0%" stop-color="#FF9EC4" stop-opacity="0.34"/>
      <stop offset="100%" stop-color="#FF9EC4" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="heart" x1="0.15" y1="0" x2="0.85" y2="1">
      <stop offset="0%" stop-color="#FFA8C8"/>
      <stop offset="48%" stop-color="#FF8FB8"/>
      <stop offset="100%" stop-color="#EF5E96"/>
    </linearGradient>
    <linearGradient id="star" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#B6F3FF"/>
      <stop offset="100%" stop-color="#4FC3E8"/>
    </linearGradient>
    <linearGradient id="wing" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#8CE7F5" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#3E9CC9" stop-opacity="0.85"/>
    </linearGradient>
  </defs>

  <!-- 底：方圆 + 中心柔光 -->
  <rect x="0" y="0" width="128" height="128" rx="30" fill="url(#bg)"/>
  <rect x="0" y="0" width="128" height="128" rx="30" fill="url(#glow)"/>

  <!-- 两侧机械翼片（先画，压在主体下面） -->
  <path d="M36 64 C 22 58 12 64 10 76 C 20 80 30 76 38 70 Z" fill="url(#wing)"/>
  <path d="M92 64 C 106 58 116 64 118 76 C 108 80 98 76 90 70 Z" fill="url(#wing)"/>
  <path d="M38 74 C 27 72 20 78 19 88 C 27 90 35 85 40 79 Z" fill="url(#wing)" opacity="0.7"/>
  <path d="M90 74 C 101 72 108 78 109 88 C 101 90 93 85 88 79 Z" fill="url(#wing)" opacity="0.7"/>

  <!-- 头饰：青色四角星芒 + 两侧小星 -->
  <path d="M64 12 L 69.5 24.5 L 82 30 L 69.5 35.5 L 64 48 L 58.5 35.5 L 46 30 L 58.5 24.5 Z" fill="url(#star)"/>
  <path d="M34 30 L 36.4 35.6 L 42 38 L 36.4 40.4 L 34 46 L 31.6 40.4 L 26 38 L 31.6 35.6 Z" fill="url(#star)" opacity="0.8"/>
  <path d="M94 30 L 96.4 35.6 L 102 38 L 96.4 40.4 L 94 46 L 91.6 40.4 L 86 38 L 91.6 35.6 Z" fill="url(#star)" opacity="0.8"/>

  <!-- 主体：粉色晶体心 -->
  <path d="M64 104 C 38 86 22 72 22 55 C 22 43.5 30.5 35 41.5 35 C 49.5 35 56 39 64 47 C 72 39 78.5 35 86.5 35 C 97.5 35 106 43.5 106 55 C 106 72 90 86 64 104 Z" fill="url(#heart)"/>

  <!-- 晶体切面：左上高光 + 右上暗面 + 中缝，做出"晶体"而不是"纯色心" -->
  <path d="M64 47 L 41.5 35 C 32 35 24 42 22.6 51.5 C 30 60 46 74 64 88 Z" fill="#FFFFFF" opacity="0.16"/>
  <path d="M64 47 L 86.5 35 C 96 35 104 42 105.4 51.5 C 98 60 82 74 64 88 Z" fill="#8E2F63" opacity="0.18"/>
  <path d="M64 47 L 64 104" stroke="#FFFFFF" stroke-opacity="0.14" stroke-width="1.6" fill="none"/>

  <!-- 高光点 -->
  <ellipse cx="45" cy="52" rx="7" ry="4.6" fill="#FFFFFF" opacity="0.4" transform="rotate(-28 45 52)"/>
  <circle cx="88" cy="46" r="2.6" fill="#FFFFFF" opacity="0.35"/>
</svg>
