# GitHub 赞助按钮（仓库页右上角 "Sponsor"）—— P4-8（v1.50）清空
#
# 为什么要清空：本文件原来填的是**上游主题作者**的收款账号
#   （ko_fi: <上游作者> + custom 指向其爱发电主页）。
# 只要这里有值，任何人在仓库页点 "Sponsor" 都会把钱打给主题作者，
# 而不是本站站主 —— 这不是"字样好不好看"的问题，是**钱会流向别人**。
#
# 保留空文件而不是删除文件，理由：
#   1. 文件在、且显式写明"没有配置赞助渠道"，比文件不存在更容易被后来者看懂
#      （删掉的话，下一个人只会看到一个缺失的 FUNDING.yml，不知道该不该建）；
#   2. GitHub 对"存在但没有任何受支持的平台键"的 FUNDING.yml 不会渲染 Sponsor 按钮，
#      即达成"点了不会打钱给别人"的目的；
#   3. 想开通自己的赞助渠道时，照下面注释里的格式加键值即可，不会误抄上游账号。
#
# 取消下面注释并填**你自己的**账号即可启用（键名取自 GitHub 支持的平台列表）：
# github: [你的GitHub用户名]
# ko_fi: 你的ko-fi用户名
# custom: ['https://你自己的赞助页']
#
# ⚠️ 绝不要填回上游主题作者的账号（那会把访客的赞助打给模板作者）。
